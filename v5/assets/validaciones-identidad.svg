<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" fill="none" role="img" aria-labelledby="identity-title identity-desc">
  <title id="identity-title">Una misma identidad</title>
  <desc id="identity-desc">Una identificación genérica y una selfie ilustrada muestran a la misma persona. Una marca de verificación conecta ambas.</desc>
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#23466F" flood-opacity=".08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#23466F" flood-opacity=".03"/>
    </filter>
    <!-- The exact same portrait geometry appears in both objects. -->
    <symbol id="portrait" viewBox="0 0 100 120">
      <path d="M4 120v-9c0-20 13-32 32-37h28c19 5 32 17 32 37v9H4Z" fill="#3778EF"/>
      <path d="M38 65h24v17c0 8-6 13-12 13s-12-5-12-13V65Z" fill="#A7C6F8"/>
      <path d="M38 71c6 5 17 5 24-1v9c-9 5-17 3-24-1v-7Z" fill="#82AFF3"/>
      <path d="M26 37c0-16 10-26 25-26 16 0 25 11 25 28v10c0 18-11 31-26 31S26 67 26 49V37Z" fill="#BDD5FA"/>
      <path d="M26 49c-5 0-7-4-7-9 0-4 3-7 7-6v15Zm50 0c5 0 7-4 7-9 0-4-3-7-7-6v15Z" fill="#BDD5FA"/>
      <path d="M24 40c-5-12-3-23 3-29C34 3 47 1 57 5c14-2 24 9 23 23l-3 14-5-2-2-19c-9 9-21 11-37 8l-4 13-5-2Z" fill="#2865CE"/>
      <path d="M46 60c3 2 6 2 9 0" stroke="#6B99E4" stroke-width="2" stroke-linecap="round"/>
      <path d="m31 78 9 17 10 9 10-9 9-17" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <clipPath id="card-portrait-clip"><rect x="78" y="147" width="90" height="111" rx="12"/></clipPath>
    <clipPath id="selfie-portrait-clip"><rect x="354" y="199" width="116" height="132" rx="13"/></clipPath>
  </defs>

  <!-- A quiet field of color; the objects keep their own silhouettes. -->
  <path d="M98 65c55-39 143-40 209-20 68 21 140 44 174 111 34 65 15 152-44 193-56 39-141 35-215 18-63-14-123-29-159-76-49-64-27-181 35-226Z" fill="#F1F6FF"/>

  <g transform="rotate(-4 211 190)">
    <rect x="48" y="91" width="329" height="208" rx="20" fill="white" filter="url(#paper-shadow)"/>
    <rect x="48.75" y="91.75" width="327.5" height="206.5" rx="19.25" stroke="#D3E2F7" stroke-width="1.5"/>
    <text x="78" y="125" fill="#456184" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="500">Identificación</text>
    <path d="M328 119h18" stroke="#FFAD16" stroke-width="3" stroke-linecap="round"/>
    <rect x="78" y="147" width="90" height="111" rx="12" fill="#EAF2FF"/>
    <g clip-path="url(#card-portrait-clip)"><use href="#portrait" x="78" y="150" width="90" height="108"/></g>
    <path d="M191 162h120" stroke="#B4C9E6" stroke-width="8" stroke-linecap="round"/>
    <path d="M191 184h84" stroke="#D8E4F3" stroke-width="6" stroke-linecap="round"/>
    <path d="M191 218h100M191 239h57" stroke="#E2EAF5" stroke-width="6" stroke-linecap="round"/>
    <path d="M79 278h65M156 278h25" stroke="#E2EAF5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="rotate(4 412 260)">
    <rect x="333" y="158" width="158" height="204" rx="21" fill="white" filter="url(#paper-shadow)"/>
    <rect x="333.75" y="158.75" width="156.5" height="202.5" rx="20.25" stroke="#D3E2F7" stroke-width="1.5"/>
    <text x="354" y="185" fill="#456184" font-family="DM Sans, Arial, sans-serif" font-size="17" font-weight="500">Selfie</text>
    <rect x="354" y="199" width="116" height="132" rx="13" fill="#EAF2FF"/>
    <g clip-path="url(#selfie-portrait-clip)"><use href="#portrait" x="357" y="201" width="110" height="132"/></g>
    <!-- Short framing marks suggest capture without imitating an app. -->
    <path d="M365 222v-8h8m78 8v-8h-8M365 307v8h8m78-8v8h-8" stroke="#87B0F2" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M402 347h20" stroke="#D6E3F5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <circle cx="337" cy="244" r="23" fill="white" filter="url(#paper-shadow)"/>
  <circle cx="337" cy="244" r="18" fill="#3778EF"/>
  <path d="m329 244 5.5 5.5 10.5-12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
